# Garage Brain — Cloudflare Configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "garage-brain"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# D1 Database — vehicles, projects, tools, measurements, history
[[d1_databases]]
binding = "DB"
database_name = "garage-brain-db"
database_id = "" # Fill after: wrangler d1 create garage-brain-db

# R2 Bucket — FSM PDFs, photos, alignment targets, OBD2 logs
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "garage-brain-storage"

# KV Namespace — session state, cache, quick lookups
[[kv_namespaces]]
binding = "CACHE"
id = "" # Fill after: wrangler kv namespace create CACHE

# AI binding — FSM search, diagnostics help, tool extraction
[ai]
binding = "AI"

# Environment variables (set via dashboard or wrangler secret)
# ANTHROPIC_API_KEY — for AI-powered FSM ingestion & search
# No secrets in this file — use `wrangler secret put <KEY>`
